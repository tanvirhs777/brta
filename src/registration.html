<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up--BRTA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <!-- Registraion page -->
    <main class="w-full h-screen bg-[#F5F7FA] flex justify-center items-center">
        <div class="w-112 h-190 bg-[#fff] flex justify-evenly items-center rounded-xl shadow-lg flex-col text-[#333]">
            <img class="w-12 pt-10" src="images/brtalogo.png" alt="logo">
            <h1 class="font-Sora font-bold text-4xl">BRTA</h1>
            <p class="font-dm text-primary pb-5">Driving Excellence</p>
            <h2 class="font-Sora font-medium text-2xl text-[#333]">Create your account</h2>
            <p class="font-dm text-[15px] mb-5">Start your driving exam journey today</p>
            <div class="space-y-4 w-[350px]">
        <div class="flex items-center bg-gray-200 rounded-xl px-4 py-3">
        <input 
            type="text" 
            placeholder="Full name"
            class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-500 px-2">
         </div>
        <div class="flex items-center bg-gray-200 rounded-xl px-4 py-3">
        <input 
            type="email" 
            placeholder="Email"
            class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-500 px-2">
         </div>
         <div class="flex items-center bg-gray-200 rounded-xl px-4 py-3">
        <input 
            type="phone" 
            placeholder="Phone number"
            class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-500 px-2">
         </div>
       <div class="flex items-center bg-gray-200 rounded-xl px-4 py-3">
        <input 
            type="password" 
            placeholder="Password"
            class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-500 px-2">
        </div>
        <div class="flex items-center bg-gray-200 rounded-xl px-4 py-3">
        <input 
            type="password" 
            placeholder="Confirm password"
            class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-500 px-2">
        </div>
    <div class="w-[350px] space-y-5">
    <div class="flex items-center justify-between text-sm">
        <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 accent-[#03A78A]">
            <span class="text-gray-600 font-dm">I agree to the <span class="text-primary">Terms </span> & 
        <span class="text-primary">    Privacy Policy</span>
        </label>
    </div>

    <button class="w-full bg-gradient-to-r from-primary to-green-600 text-white py-3 rounded-xl font-semibold flex items-center justify-center gap-2 hover:opacity-90 transition font-dm">
        Create Accont
        <span>→</span>
    </button>

    <p class="pb-10 text-center text-gray-600 text-sm">
        Already have an account?
        <a href="login.html" class="text-primary font-medium hover:underline">
            Sign in account
        </a>
    </p>

</div>

</div>
        </div>
    </main>
</body>
</html>
