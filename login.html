<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in--BRTA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <!-- Login page -->
    <main class="w-full h-screen bg-[#F5F7FA] flex justify-center items-center">
        <div class="w-112 h-148 bg-[#fff] flex justify-around items-center rounded-xl shadow-lg flex-col">
            <img class="w-12 pt-10" src="images/brtalogo.png" alt="logo">
            <h1 class="font-Sora font-bold text-4xl text-[#333]">BRTA</h1>
            <p class="font-dm text-primary pb-8">Driving Excellence</p>
            <h2 class="font-Sora font-medium text-2xl pb-0 text-[#333]">Welcome back</h2>
            <p class="font-dm text-[15px] pb-4">Sign in to continue your preparation</p>
            <div class="space-y-4 w-[350px]">
    
        <div class="flex items-center bg-gray-200 border border-[#9999] rounded-lg px-4 py-3">
            <i class="fa-regular fa-envelope"></i>
        <input 
            type="email" 
            placeholder="ahmed@example.com"
            class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-500  px-2">
         </div>

       <div class="flex items-center bg-gray-200 px-4 py-3 border border-[#9999] rounded-lg ">
        <i class="fa-solid fa-lock"></i>
        <input 
            type="password" 
            placeholder="••••••••"
            class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-500 px-2">
        
    </div>

    <div class="w-[350px] space-y-5">
    <div class="flex items-center justify-between text-sm">
        <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 accent-[#03A78A]">
            <span class="text-gray-600">Remember me</span>
        </label>
        <a href="#" class="text-primary font-medium hover:underline">
            Forgot password?
        </a>
    </div>

    <a href="dashboard.html" class="w-full bg-gradient-to-r from-primary to-green-600 text-white py-3 rounded-xl font-semibold flex           items-center justify-center gap-2 hover:opacity-90 transition font-dm text-center">
    Sign In
    <span>→</span>
</a>
    <p class="pb-10 text-center text-gray-600 text-sm">
        Don't have an account?
        <a href="registration.html" class=" text-primary font-medium hover:underline">
            Create account
        </a>
    </p>

</div>

</div>
        </div>
    </main>
</body>
</html>
